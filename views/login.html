<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — El Túnel</title>
  <style>
    /* Estilos del formulario de login */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-card h1 { color: #403022; text-align: center; margin-bottom: 8px; }
    .login-card p  { color: #777; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus { border-color: #733036; }
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #733036;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-login:hover { background-color: #5a2029; }
    .mensaje-error {
      background-color: #fde8e8;
      color: #c62828;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }
    .links { text-align: center; margin-top: 20px; }
    .links a { color: #733036; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>📚 El Túnel</h1>
    <p>Inicia sesión para continuar</p>

    <!-- Mensaje de error -->
    <div class="mensaje-error" id="error-msg"></div>

    <!-- Formulario de login -->
    <form id="form-login">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="btn-login">Iniciar sesión</button>
    </form>

    <div class="links">
      <a href="/">← Volver a la tienda</a>
    </div>
  </div>


<script>
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');
    const boton = document.querySelector('.btn-login');

    errorMsg.style.display = 'none';
    boton.disabled = true;
    boton.textContent = 'Verificando...';

    try {
      const respuesta = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'same-origin',
        body: JSON.stringify({ email, password })
      });

      const datos = await respuesta.json();

      if (!respuesta.ok || datos.status !== 'success') {
        throw new Error(datos.message || 'Credenciales incorrectas');
      }

      // Tu controlador devuelve el usuario dentro de data.usuario
      const usuario = datos.data.usuario;

      // Redirigir según el rol real del usuario
      if (usuario.rol === 'admin') {
        window.location.href = '/admin';
      } else {
        window.location.href = '/';
      }

    } catch (error) {
      errorMsg.textContent = error.message || 'Error de conexión. Intenta de nuevo.';
      errorMsg.style.display = 'block';
    } finally {
      boton.disabled = false;
      boton.textContent = 'Iniciar sesión';
    }
  });
</script>

</body>
</html>
